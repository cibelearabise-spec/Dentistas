<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow Odonto & Skin App - Dark Neon</title>
  <style>
    body {
      background-color: #07040F;
      color: #FFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .phone-container {
      width: 360px;
      height: 740px;
      border: 3px solid #3D2862;
      border-radius: 40px;
      background: linear-gradient(180deg, #0B0719 0%, #180E29 50%, #230A3E 100%);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 30px rgba(157, 78, 221, 0.3);
    }
    .hero-img {
      width: 100%;
      height: 60%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 55%;
      background: linear-gradient(to top, #0B0719 70%, transparent);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-sizing: border-box;
    }
    .badge {
      color: #00F2FE;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      margin: 0 0 6px 0;
    }
    .desc {
      color: #A0A0C0;
      font-size: 13px;
      line-height: 18px;
      margin-bottom: 20px;
    }
    .btn {
      background: linear-gradient(90deg, #F72585, #9D4EDD);
      padding: 14px;
      border-radius: 30px;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      color: #FFF;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <img src="https://i.postimg.cc/mDsk9h2C/dentist-hero.png" class="hero-img" alt="Dentista Dra. Cibele Arabise">
    <div class="overlay">
      <div class="badge">GLOW ODONTO & SKIN</div>
      <h2 class="title">Dra. Cibele Arabise</h2>
      <p class="desc">Alinhadores invisíveis, harmonização orofacial e estética antienvelhecimento integrada.</p>
      <a href="#" class="btn">ENTRAR NO APLICATIVO</a>
    </div>
  </div>

</body>
</html>
